<style>
    .one-button {
        background-color: green;
        color: white;
        border: none;
        padding-left: 15px;
        padding-right: 15px;
        padding-bottom: 8px;
        padding-top: 8px;
        cursor: pointer;
        margin-left: 10px;
        margin-right: 10px;
        transition: padding 0.15s,
        margin 0.15s;
    
    }
    .one-button:hover {
        padding-left: 25px;
        padding-right: 25px;
        margin-left: 0px;
        margin-right: 0px;
    }

    .two-button {
        background-color: green;
        color: white;
        border: none;
        padding-left: 15px;
        padding-right: 15px;
        padding-bottom: 8px;
        padding-top: 8px;
        margin-right: 10px;
        margin-left: 10px;
    }
    .two-button:hover {
        padding-left: 25px;
        padding-right: 25px;
        margin-left: 0px;
        margin-right: 0px;
    }

    .three-button {
        background-color: green;
        color: white;
        border: none;
        padding-left: 18px;
        padding-right: 18px;
        padding-bottom: 8px;
        padding-top: 8px;
        margin-right: 10px;
        margin-left: 10px;
    }
    .three-button:hover {
        padding-left: 30px;
        padding-right: 30px;
        margin-left: 0px;
        margin-right: 0px;
    }
    
    
</style>

<button class="one-button">
    One
</button>
<button class="two-button">
    Two
</button>
<button class="three-button">
    Three
</button>
