<style>
    .Apply-button {
        background-color: rgb(10, 102, 194);
        border: none;
        height: 40px;
        width: 240px;
        color: white;
        border-radius: 20px;
        font-weight: bold;
        margin-right: 8px;
        transition: background-color 0.15s;
    }
    .Apply-button:hover {
        background-color: darkblue;
    }
    .Save-button {
        background-color: white;
        color: rgb(10, 102, 194);
        border-color: rgb(10, 102, 194);
        height: 40px;
        width: 80px;
        border-width: 1px;
        border-radius: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 00.15s,
        border-width 0.15s;
    }
    .Save-button:hover {
        background-color: rgb(204, 229, 240);
        border-width: 2px;
    }

</style>

<button class="Apply-button">
    Apply on company website
</button>

<button class="Save-button">
    Save
</button>
